<!DOCTYPE html>
<html>
<head>
  <title>My Shift App</title>

  <!-- PWA Setup -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: -apple-system;
      background:#f2f2f7;
      margin:0;
      padding:20px;
    }

    h2 { text-align:center; }

    .card {
      background:white;
      padding:15px;
      border-radius:15px;
      margin-bottom:15px;
    }

    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:1px solid #ddd;
    }

    button {
      background:#007aff;
      color:white;
      border:none;
    }

    .shift {
      display:flex;
      justify-content:space-between;
      padding:10px;
      border-radius:10px;
      margin-top:10px;
    }

    .E { background:#cce5ff; }
    .N { background:#e5e5ea; }
  </style>
</head>

<body>

<h2>📅 My Shifts</h2>

<div class="card">
  <input type="date" id="startDate">
  <input type="number" id="payRate" placeholder="Hourly Pay">
  <input type="file" id="imageInput">
  <button onclick="processImage()">Scan Schedule</button>
</div>

<div id="schedule"></div>

<div class="card">
  <p>Total Hours: <span id="hours">0</span></p>
  <p>Total Pay: $<span id="pay">0</span></p>
</div>

<script>
const shifts = {
  "E": { start: "2:30 PM", end: "10:30 PM", hours: 8 },
  "N": { start: "10:30 PM", end: "6:30 AM", hours: 8 }
};

async function processImage() {
  const file = document.getElementById("imageInput").files[0];
  if (!file) return alert("Upload image");

  const startDate = document.getElementById("startDate").value;
  if (!startDate) return alert("Pick a start date");

  const { data: { text } } = await Tesseract.recognize(file, 'eng');

  let entries = text.replace(/[^EN]/g, "").split("").filter(x => x === "E" || x === "N");

  let base = new Date(startDate);
  let totalHours = 0;
  let totalPay = 0;
  let rate = parseFloat(document.getElementById("payRate").value) || 0;

  let container = document.getElementById("schedule");
  container.innerHTML = "";

  entries.forEach((shift, i) => {
    let d = new Date(base);
    d.setDate(base.getDate() + i);

    let hours = shifts[shift].hours;
    let pay = hours * rate;

    totalHours += hours;
    totalPay += pay;

    let div = document.createElement("div");
    div.className = "shift " + shift;
    div.innerHTML = `
      <div>${d.toLocaleDateString()}<br>${shift}</div>
      <div>$${pay.toFixed(2)}</div>
    `;
    container.appendChild(div);
  });

  document.getElementById("hours").innerText = totalHours;
  document.getElementById("pay").innerText = totalPay.toFixed(2);
}
</script>

</body>
</html>
